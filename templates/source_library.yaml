topics:
  core_therapy_techniques:
    display_name: "Core Therapy Techniques"
    description: "Foundational therapeutic frameworks — ACT, IFS, CBT, mindfulness"
    required: true
    core_sources:
      - title: "The Happiness Trap"
        author: "Russ Harris"
        type: book
        why: "Accessible ACT introduction for clients and practitioners"
      - title: "No Bad Parts"
        author: "Richard Schwartz"
        type: book
        why: "IFS fundamentals written for a general audience"
      - title: "Get Out of Your Mind and Into Your Life"
        author: "Steven Hayes"
        type: book
        why: "ACT workbook with practical exercises for psychological flexibility"
      - title: "Cognitive Behavior Therapy: Basics and Beyond"
        author: "Judith Beck"
        type: book
        why: "Foundational CBT techniques and case conceptualization"
    supplemental_sources:
      - title: "The Body Keeps the Score"
        author: "Bessel van der Kolk"
        type: book
        why: "Understanding how trauma affects the body and mind"
      - title: "Radical Acceptance"
        author: "Tara Brach"
        type: book
        why: "Mindfulness-based emotional acceptance practices"

  self_compassion_shame:
    display_name: "Self-Compassion & Shame Resilience"
    description: "Shame resilience, self-compassion, emotional regulation"
    required: true
    core_sources:
      - title: "Self-Compassion: The Proven Power of Being Kind to Yourself"
        author: "Kristin Neff"
        type: book
        why: "Foundational self-compassion research and practice"
      - title: "I Thought It Was Just Me (But It Isn't)"
        author: "Brené Brown"
        type: book
        why: "Shame resilience framework — accessible, research-grounded"
      - title: "The Mindful Path to Self-Compassion"
        author: "Christopher Germer"
        type: book
        why: "Practical guide to self-compassion through mindfulness"
    supplemental_sources:
      - title: "Daring Greatly"
        author: "Brené Brown"
        type: book
        why: "Vulnerability and shame resilience in everyday life"

  cptsd_trauma:
    display_name: "CPTSD & Trauma"
    description: "Complex trauma recovery, emotional flashbacks, nervous system regulation"
    required: false
    core_sources:
      - title: "Complex PTSD: From Surviving to Thriving"
        author: "Pete Walker"
        type: book
        why: "The definitive guide to understanding and recovering from CPTSD"
      - title: "The Body Keeps the Score"
        author: "Bessel van der Kolk"
        type: book
        why: "How trauma reshapes the body and brain, and innovative treatments"
      - title: "Waking the Tiger"
        author: "Peter Levine"
        type: book
        why: "Somatic Experiencing approach to healing trauma"
      - title: "Trauma and Recovery"
        author: "Judith Herman"
        type: book
        why: "Foundational framework for understanding trauma recovery stages"
    supplemental_sources:
      - title: "What My Bones Know"
        author: "Stephanie Foo"
        type: book
        why: "Personal CPTSD recovery narrative with clinical context"

  adhd_executive_function:
    display_name: "ADHD & Executive Function"
    description: "Attention differences, executive function strategies, dopamine-aware approaches"
    required: false
    core_sources:
      - title: "Driven to Distraction"
        author: "Edward Hallowell & John Ratey"
