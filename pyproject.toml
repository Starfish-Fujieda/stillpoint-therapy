[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stillpoint"
version = "0.1.0"
description = "AI-assisted self-therapy framework with customizable therapist persona, clinical knowledge grounding, and persistent session memory"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Starfish Fujieda"},
]
keywords = ["therapy", "ai", "self-help", "act", "ifs", "gradio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Health & Wellness :: Mental Health",
]

dependencies = [
    "gradio>=4.0",
    "chromadb>=1.5.0",
    "mempalace>=3.3.5",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.18"]
openai = ["openai>=1.0"]
google = ["google-generativeai"]
all-providers = ["anthropic>=0.18", "openai>=1.0", "google-generativeai"]
dev = ["ruff>=0.1.0", "pytest>=7.0", "pytest-cov"]

[project.scripts]
stillpoint = "app.main:main"

[tool.setuptools.packages.find]
include = ["stillpoint*", "app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]